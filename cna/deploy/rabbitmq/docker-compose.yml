# RabbitMQ (broker de mensajes, ADR-007).
# Esta noche corre en VM-1 para probar; mañana se mueve a VM-2 sin cambios en este archivo.
services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    # El hostname fijo hace que los datos persistan entre reinicios
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "${RABBIT_ADMIN_PASSWORD}"
    ports:
      - "5672:5672"     # AMQP (servicios)
      - "15672:15672"   # consola web
      - "15692:15692"   # métricas Prometheus
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  rabbitdata:
