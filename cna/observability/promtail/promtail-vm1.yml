# Promtail en VM-1: envía a Loki (en VM-2) los logs del event-bridge, de LibreCloset
# y el log JSON del gateway Nginx (con el request_id de cada petición).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://192.168.56.11:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - target_label: job
        replacement: docker
      - target_label: node
        replacement: librecloset
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
      - labels:
          service:
          level:

  - job_name: gateway
    static_configs:
      - targets: [localhost]
        labels:
          job: gateway
          service: gateway
          node: librecloset
          __path__: /var/log/nginx/api-access.log
