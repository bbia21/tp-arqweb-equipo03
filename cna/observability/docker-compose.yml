# Observabilidad (C3), en VM-2 (no hay VM-3: ADR-008). Se une a la red de los servicios para
# encontrarlos por nombre. Las configuraciones van dentro de imágenes propias, así se puede
# desplegar desde VM-1 (make up) sin depender de archivos del host remoto.
# Grafana y Prometheus solo escuchan en 127.0.0.1 de VM-2: se acceden con un túnel SSH.
services:
  prometheus:
    build: ./prometheus
    image: cna-prometheus:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki
    ports:
      # Lo usa Promtail de VM-1 (DOCKER-USER solo deja entrar desde 192.168.56.10)
      - "3100:3100"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  promtail:
    build:
      context: ./promtail
      args:
        CONFIG: promtail-vm2.yml
    image: cna-promtail-vm2:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  jaeger:
    # Trazas distribuidas (C3). Jaeger v2: recibe OTLP en 4318 y guarda en memoria (alcanza para la demo).
    image: jaegertracing/jaeger:2.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"   # interfaz web, por túnel SSH
      # OTLP/HTTP: lo usan los servicios de VM-2 por la red interna y el event-bridge de VM-1
      # (DOCKER-USER solo deja entrar desde 192.168.56.10)
      - "4318:4318"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana:
    build: ./grafana
    image: cna-grafana:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/red.json
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  promdata:
  lokidata:
  grafanadata:

networks:
  default:
    external: true
    name: vm2_default
