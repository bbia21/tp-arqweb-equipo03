# Prometheus (corre en VM-2). Se usa dns_sd para encontrar todas las réplicas de un servicio
# (necesario al escalar weather-svc de 1 a 3 en C2).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: calendar-svc
    dns_sd_configs:
      - names: [calendar-svc]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: wear-stats-svc
    dns_sd_configs:
      - names: [wear-stats-svc]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: weather-svc
    dns_sd_configs:
      - names: [weather-svc]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: event-bridge
    static_configs:
      - targets: ["192.168.56.10:8080"]
        labels: { node: librecloset }

  - job_name: rabbitmq
    # per-object: métricas por cola (profundidad de calendar.q, stats.q y closet.dlq)
    metrics_path: /metrics/per-object
    scrape_interval: 15s
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
