openapi: 3.1.0
info:
  title: wear-stats-svc (S2)
  version: 1.0.0
  description: >-
    Estadísticas de uso de outfits. 100 % alimentado por eventos closet.calendar.* (cola stats.q):
    suma 1 cuando una entrada del calendario se marca como usada y resta 1 si se desmarca o se borra.
    Expuesto por el gateway en https://api.librecloset.arqweb.test/v2/stats
  contact:
    name: Bianca Benítez
    url: https://github.com/bbia21/tp-arqweb-equipo03
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: https://api.librecloset.arqweb.test
    description: Gateway (Nginx, TLS 1.3)
tags:
  - name: estadisticas
    description: Usos por outfit
  - name: operacion
    description: Salud y métricas
paths:
  /v2/stats/outfits/top:
    get:
      operationId: topOutfits
      summary: Outfits más usados
      description: Outfits más usados.
      tags: [estadisticas]
      parameters:
        - name: limit
          in: query
          description: Cantidad máxima de outfits (1 a 50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
          example: 5
      responses:
        '200':
          description: Ranking de outfits por cantidad de usos.
          content:
            application/json:
              schema:
                type: object
                required: [count, outfits]
                properties:
                  count: { type: integer }
                  outfits:
                    type: array
                    items:
                      type: object
                      required: [outfit_id, worn]
                      properties:
                        outfit_id: { type: integer }
                        worn: { type: integer, minimum: 0 }
              example: { count: 1, outfits: [{ outfit_id: 3, worn: 1 }] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v2/stats/outfits/{id}:
    get:
      operationId: outfitStats
      summary: Usos de un outfit
      description: Usos de un outfit.
      tags: [estadisticas]
      parameters:
        - name: id
          in: path
          required: true
          description: Id del outfit en Libre Closet.
          schema: { type: integer }
          example: 3
      responses:
        '200':
          description: Cantidad de usos y última fecha.
          content:
            application/json:
              schema:
                type: object
                required: [outfit_id, worn]
                properties:
                  outfit_id: { type: integer }
                  worn: { type: integer }
                  last_worn_at: { type: [string, 'null'], format: date-time }
              example: { outfit_id: 3, worn: 1, last_worn_at: '2026-11-08T21:25:28.929Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /healthz:
    get:
      operationId: healthz
      summary: Proceso vivo
      description: Proceso vivo.
      tags: [operacion]
      responses:
        '200':
          description: El proceso responde.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
              example: { status: ok }
  /readyz:
    get:
      operationId: readyz
      summary: Listo para atender (Redis y broker disponibles)
      description: Listo para atender (Redis y broker disponibles).
      tags: [operacion]
      responses:
        '200':
          description: Listo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example: { status: ready, cache: true, broker: true }
        '503':
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example: { status: not_ready, cache: false, broker: true }
  /metrics:
    get:
      operationId: metrics
      summary: Métricas en formato Prometheus
      description: Métricas en formato Prometheus.
      tags: [operacion]
      responses:
        '200':
          description: Contadores y histogramas.
          content:
            text/plain:
              schema: { type: string }
              example: 'events_consumed_total{type="closet.calendar.updated",result="processed"} 4'
components:
  schemas:
    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ready, not_ready] }
        cache: { type: boolean }
        broker: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
        request_id: { type: string }
  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: bad_request, detail: limit tiene que estar entre 1 y 50 }
    NotFound:
      description: El outfit no tiene usos registrados.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not_found, detail: ese outfit todavía no tiene usos registrados }
    TooManyRequests:
      description: Se superó el límite de 20 peticiones por segundo del gateway.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: too_many_requests, request_id: 4b1f0c2e9d7a46b3a1c0e2f3d4b5a6c7 }
    Unavailable:
      description: El servicio no está disponible (respuesta JSON uniforme del gateway).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: service_unavailable, detail: el servicio no esta disponible, request_id: f167e0ebd1f6c62d83ba5a4eae0a59d1 }
